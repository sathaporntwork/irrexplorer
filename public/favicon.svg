<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Icon Background -->
  <rect width="64" height="64" rx="16" fill="#07090e" stroke="#1e293b" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#grad1)" fill-opacity="0.12"/>
  
  <!-- Outer Globe Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#grad1)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Latitude / Longitude Lines -->
  <ellipse cx="32" cy="32" rx="10" ry="22" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Core Routing Nodes -->
  <circle cx="32" cy="32" r="3.5" fill="#10b981"/>
  <circle cx="22" cy="22" r="2.5" fill="#38bdf8"/>
  <circle cx="42" cy="42" r="2.5" fill="#38bdf8"/>
</svg>